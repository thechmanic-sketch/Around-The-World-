<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Around The World Meet | Video Calls</title>
<meta name="description" content="Free video meetings by Around The World. Start a call, share the link, and talk face to face.">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* ---------- Lobby ---------- */
  .lobby{max-width:1100px;margin:0 auto;padding:4rem 1.25rem;display:grid;grid-template-columns:1.2fr 1fr;gap:2.5rem;align-items:center}
  .preview{position:relative;aspect-ratio:16/10;border-radius:var(--radius);overflow:hidden;background:var(--bg2);border:1px solid var(--border)}
  .preview video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .preview .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.6rem;color:var(--muted);text-align:center;padding:1rem}
  .preview .avatar{width:84px;height:84px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#fff}
  .preview .toggles{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:.7rem}
  .round{width:48px;height:48px;border-radius:50%;border:1px solid var(--border);background:rgba(13,13,24,.75);color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px)}
  .round.off-state{background:#e5484d;border-color:#e5484d}
  .panel h1{font-size:clamp(2rem,4.5vw,3.2rem);margin:.8rem 0 .6rem}
  .panel p{color:var(--muted);margin:0 0 1.5rem}
  .field{display:block;margin-bottom:1rem;font-size:.9rem;color:var(--muted)}
  .field input{display:block;width:100%;margin-top:.35rem;padding:.8rem 1rem;border-radius:14px;border:1px solid var(--border);background:var(--glass);color:var(--text);font:inherit;font-size:1rem}
  .field input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .join-row{display:flex;gap:.6rem;align-items:flex-end}
  .join-row .field{flex:1;margin:0}
  .join-row .btn{margin:0;white-space:nowrap}
  .divider{display:flex;align-items:center;gap:.8rem;color:var(--muted);font-size:.85rem;margin:1.3rem 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
  .err{color:#ff8a8f;font-size:.9rem;min-height:1.3em;margin-top:.6rem}

  /* ---------- Meeting ---------- */
  body.in-call{overflow:hidden}
  body.in-call .nav,body.in-call .lobby,body.in-call footer{display:none}
  .room{display:none;position:fixed;inset:0;flex-direction:column;background:#000;z-index:50}
  body.in-call .room{display:flex}
  .room-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 1rem;background:var(--bg2);border-bottom:1px solid var(--border);font-size:.9rem}
  .room-top .meta{display:flex;align-items:center;gap:.8rem;min-width:0}
  .room-top .meta strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live{display:inline-flex;align-items:center;gap:.4rem;color:var(--accent3);font-variant-numeric:tabular-nums}
  .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent3);box-shadow:0 0 10px var(--accent3)}
  .chip{background:var(--glass);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:.4rem .9rem;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
  #stage{flex:1;min-height:0;position:relative}
  #stage iframe{width:100%;height:100%;border:0;display:block}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .toolbar{display:flex;justify-content:center;align-items:stretch;gap:.25rem;padding:.5rem .75rem;background:var(--bg2);border-top:1px solid var(--border);overflow-x:auto}
  .tool{display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:72px;padding:.45rem .6rem;border:0;border-radius:12px;background:transparent;color:var(--text);font:inherit;font-size:.75rem;cursor:pointer;position:relative}
  .tool:hover{background:var(--glass)}
  .tool.active{color:var(--accent3)}
  .tool.muted svg{color:#ff6b70}
  .tool .count{position:absolute;top:2px;right:12px;background:var(--accent);color:#fff;border-radius:999px;font-size:.65rem;padding:0 .4rem;line-height:1.4}
  .tool.leave{background:#e5484d;color:#fff;margin-left:.75rem;min-width:84px}
  .tool.leave:hover{background:#c93a3f}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:.6rem 1rem;border-radius:999px;font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
  .toast.show{opacity:1}
  @media (max-width:820px){
    .lobby{grid-template-columns:1fr;padding:2rem 16px}
    .tool{min-width:58px;padding:.4rem .3rem;font-size:.68rem}
    .tool .hide-sm{display:none}
    .tool.leave{margin-left:.3rem;min-width:64px}
    .room-top .hide-sm{display:none}
  }
</style>
</head>
<body>
<header class="nav">
  <a class="logo" href="index.html"><img class="mark" src="assets/logo-mark.svg" alt="" width="34" height="34"><span class="brand">Around The World<small>Meet</small></span></a>
  <nav><a href="index.html">Back to site</a></nav>
</header>

<main class="lobby" id="lobby">
  <div class="preview">
    <video id="selfview" autoplay muted playsinline></video>
    <div class="off" id="previewOff"><div class="avatar" id="avatar">?</div><span id="previewMsg">Camera is off</span></div>
    <div class="toggles">
      <button class="round" id="lobbyMic" type="button" aria-pressed="true" aria-label="Microphone on" title="Microphone"></button>
      <button class="round" id="lobbyCam" type="button" aria-pressed="true" aria-label="Camera on" title="Camera"></button>
    </div>
  </div>

  <div class="panel">
    <p class="eyebrow">Video meetings</p>
    <h1>Talk face to face, anywhere.</h1>
    <p>Start a meeting, share the link, and you're in. No downloads or sign-ups for your guests.</p>
    <label class="field">Your name<input id="name" autocomplete="name" placeholder="e.g. Thandi" maxlength="40"></label>
    <button class="btn" id="newMeeting" type="button">New meeting</button>
    <div class="divider">or join with a code</div>
    <div class="join-row">
      <label class="field">Meeting code<input id="code" placeholder="atw-abcd-efgh" autocapitalize="off" spellcheck="false"></label>
      <button class="btn ghost" id="joinBtn" type="button">Join</button>
    </div>
    <div class="err" id="err" role="alert"></div>
  </div>
</main>

<section class="room" id="room" aria-label="Meeting">
  <div class="room-top">
    <div class="meta"><span class="live" id="timer">00:00</span><strong id="roomName"></strong></div>
    <button class="chip" id="copyLink" type="button">Copy invite link</button>
  </div>
  <div id="stage"><div class="loading" id="loading">Connecting…</div></div>
  <div class="toolbar" role="toolbar" aria-label="Meeting controls">
    <button class="tool" id="tMic" type="button"></button>
    <button class="tool" id="tCam" type="button"></button>
    <button class="tool" id="tPeople" type="button"></button>
    <button class="tool" id="tChat" type="button"></button>
    <button class="tool" id="tShare" type="button"></button>
    <button class="tool" id="tHand" type="button"></button>
    <button class="tool hide-sm" id="tView" type="button"></button>
    <button class="tool leave" id="tLeave" type="button"></button>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer>
  <p>Around The World Meet · a <strong>Techmanic</strong> brand · <a href="index.html">360 photo booth hire</a></p>
</footer>

<script>
/* ---- Settings ----
   DOMAIN: the Jitsi server that carries the video. meet.jit.si is free but limits
   embedded calls (see README notes in the commit). Swap for your own Jitsi server
   or an 8x8 JaaS domain later without changing anything else. */
var DOMAIN = 'meet.jit.si';
var ROOM_PREFIX = 'AroundTheWorld-'; // keeps our rooms apart from other people's on the shared server

var $ = function(id){return document.getElementById(id)};
var ICONS = {
  mic:'<path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>',
  micOff:'<path d="M15 9.3V6a3 3 0 0 0-5.7-1.3M9 9v3a3 3 0 0 0 5 2.2M19 11a7 7 0 0 1-1.1 3.8M5 11a7 7 0 0 0 11 5.7M12 18v3M3 3l18 18"/>',
  cam:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/>',
  camOff:'<path d="M16 16v1a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h1M10 6h5a1 1 0 0 1 1 1v3l5-3v10M3 3l18 18"/>',
  people:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.9.3 5 2.7 5 5.8"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  share:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 14V8M9 10.5 12 7.5l3 3M8 21h8"/>',
  hand:'<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-6.5a1.5 1.5 0 0 1 3 0V11m0-4.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-.5a6 6 0 0 1-4.6-2.2L3.4 16a1.6 1.6 0 0 1 2.4-2.1L8 16"/>',
  grid:'<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>',
  leave:'<path d="M3 15.5c5-4.7 13-4.7 18 0l-2.2 2.2-3.3-1.6V13a12 12 0 0 0-7 0v3.1l-3.3 1.6z"/>'
};
function icon(name,size){return '<svg viewBox="0 0 24 24" width="'+(size||22)+'" height="'+(size||22)+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[name]+'</svg>'}
function setTool(el,ic,label,extra){el.innerHTML=icon(ic)+'<span>'+label+'</span>'+(extra||'');el.setAttribute('aria-label',label)}
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('show')},2200)}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

/* ---- Meeting codes ---- */
function randomCode(){
  var a='abcdefghjkmnpqrstuvwxyz',s='';
  var r=new Uint8Array(8);crypto.getRandomValues(r);
  for(var i=0;i<8;i++){s+=a[r[i]%a.length];if(i===3)s+='-'}
  return 'atw-'+s;
}
function cleanCode(v){
  v=(v||'').trim();
  var m=v.match(/[?&]room=([^&#]+)/);if(m)v=decodeURIComponent(m[1]); // accept a pasted invite link
  return v.toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
}
function inviteLink(code){return location.origin+location.pathname+'?room='+encodeURIComponent(code)}

/* ---- Lobby preview ---- */
var state={mic:true,cam:true,stream:null};
function renderLobbyToggles(){
  var m=$('lobbyMic'),c=$('lobbyCam');
  m.innerHTML=icon(state.mic?'mic':'micOff');m.classList.toggle('off-state',!state.mic);m.setAttribute('aria-pressed',state.mic);m.setAttribute('aria-label',state.mic?'Microphone on':'Microphone off');
  c.innerHTML=icon(state.cam?'cam':'camOff');c.classList.toggle('off-state',!state.cam);c.setAttribute('aria-pressed',state.cam);c.setAttribute('aria-label',state.cam?'Camera on':'Camera off');
  var showVideo=state.cam&&state.stream&&state.stream.getVideoTracks().length;
  $('previewOff').style.display=showVideo?'none':'flex';
  if(state.stream)state.stream.getTracks().forEach(function(t){t.enabled=t.kind==='video'?state.cam:state.mic});
}
function startPreview(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('previewMsg').textContent='This browser can\'t show a camera preview';renderLobbyToggles();return}
  navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(function(s){
    state.stream=s;$('selfview').srcObject=s;renderLobbyToggles();
  }).catch(function(){
    $('previewMsg').textContent='Allow camera and microphone access to be seen and heard';renderLobbyToggles();
  });
}
function stopPreview(){if(state.stream){state.stream.getTracks().forEach(function(t){t.stop()});state.stream=null}}
$('lobbyMic').onclick=function(){state.mic=!state.mic;renderLobbyToggles()};
$('lobbyCam').onclick=function(){state.cam=!state.cam;renderLobbyToggles()};
$('name').addEventListener('input',function(){var n=this.value.trim();$('avatar').textContent=n?n[0].toUpperCase():'?'});

/* ---- Meeting ---- */
var api=null,timerId=null,people=1;
function needName(){
  var n=$('name').value.trim();
  if(!n){$('err').textContent='Please enter your name so others know who you are.';$('name').focus();return null}
  store('atw-name',n);return n;
}
function startMeeting(code){
  $('err').textContent='';
  var name=needName();if(!name)return;
  if(!code){$('err').textContent='Enter a meeting code, or start a new meeting.';$('code').focus();return}
  if(typeof JitsiMeetExternalAPI==='undefined'){$('err').textContent='The video service didn\'t load. Check your connection and refresh the page.';return}

  stopPreview(); // free the camera so the call can use it
  history.replaceState(null,'','?room='+encodeURIComponent(code));
  document.body.classList.add('in-call');
  $('roomName').textContent=code;
  $('loading').style.display='flex';
  people=1;renderTools({audioMuted:!state.mic,videoMuted:!state.cam,sharing:false,hand:false});

  api=new JitsiMeetExternalAPI(DOMAIN,{
    roomName:ROOM_PREFIX+code,
    parentNode:$('stage'),
    width:'100%',height:'100%',
    userInfo:{displayName:name},
    configOverwrite:{
      prejoinConfig:{enabled:false},
      prejoinPageEnabled:false,
      startWithAudioMuted:!state.mic,
      startWithVideoMuted:!state.cam,
      toolbarButtons:[],           // we draw our own toolbar
      disableDeepLinking:true,
      hideConferenceSubject:true,
      hideConferenceTimer:true,
      notifications:[]
    },
    interfaceConfigOverwrite:{SHOW_JITSI_WATERMARK:false,SHOW_WATERMARK_FOR_GUESTS:false,MOBILE_APP_PROMO:false,TILE_VIEW_MAX_COLUMNS:4}
  });

  api.addListener('videoConferenceJoined',function(){
    $('loading').style.display='none';
    var start=Date.now();clearInterval(timerId);
    timerId=setInterval(function(){
      var s=Math.floor((Date.now()-start)/1000),h=Math.floor(s/3600),m=Math.floor(s/60)%60,ss=s%60;
      $('timer').textContent=(h?h+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
    },1000);
  });
  api.addListener('audioMuteStatusChanged',function(e){renderTools({audioMuted:e.muted})});
  api.addListener('videoMuteStatusChanged',function(e){renderTools({videoMuted:e.muted})});
  api.addListener('screenSharingStatusChanged',function(e){renderTools({sharing:e.on})});
  api.addListener('raiseHandUpdated',function(e){if(e&&e.id===myId)renderTools({hand:!!e.handRaised})});
  api.addListener('videoConferenceJoined',function(e){myId=e.id});
  api.addListener('participantJoined',function(e){people++;renderTools({});toast((e.displayName||'Someone')+' joined')});
  api.addListener('participantLeft',function(){people=Math.max(1,people-1);renderTools({})});
  api.addListener('readyToClose',endMeeting);
}
var myId=null,tools={audioMuted:false,videoMuted:false,sharing:false,hand:false};
function renderTools(p){
  for(var k in p)tools[k]=p[k];
  setTool($('tMic'),tools.audioMuted?'micOff':'mic',tools.audioMuted?'Unmute':'Mute');$('tMic').classList.toggle('muted',tools.audioMuted);
  setTool($('tCam'),tools.videoMuted?'camOff':'cam',tools.videoMuted?'Start video':'Stop video');$('tCam').classList.toggle('muted',tools.videoMuted);
  setTool($('tPeople'),'people','Participants','<span class="count">'+people+'</span>');
  setTool($('tChat'),'chat','Chat');
  setTool($('tShare'),'share',tools.sharing?'Stop share':'Share screen');$('tShare').classList.toggle('active',tools.sharing);
  setTool($('tHand'),'hand',tools.hand?'Lower hand':'Raise hand');$('tHand').classList.toggle('active',tools.hand);
  setTool($('tView'),'grid','Gallery view');
  setTool($('tLeave'),'leave','Leave');
}
function cmd(c){if(api)api.executeCommand(c)}
$('tMic').onclick=function(){cmd('toggleAudio')};
$('tCam').onclick=function(){cmd('toggleVideo')};
$('tPeople').onclick=function(){cmd('toggleParticipantsPane')};
$('tChat').onclick=function(){cmd('toggleChat')};
$('tShare').onclick=function(){cmd('toggleShareScreen')};
$('tHand').onclick=function(){cmd('toggleRaiseHand');renderTools({hand:!tools.hand})};
$('tView').onclick=function(){cmd('toggleTileView')};
$('tLeave').onclick=function(){if(api){api.executeCommand('hangup');setTimeout(endMeeting,400)}};
$('copyLink').onclick=function(){
  var link=inviteLink($('roomName').textContent);
  var done=function(){toast('Invite link copied')};
  if(navigator.clipboard)navigator.clipboard.writeText(link).then(done,function(){prompt('Copy this invite link:',link)});
  else prompt('Copy this invite link:',link);
};
function endMeeting(){
  if(!api)return;
  try{api.dispose()}catch(e){}
  api=null;clearInterval(timerId);$('timer').textContent='00:00';
  document.body.classList.remove('in-call');
  history.replaceState(null,'',location.pathname);
  startPreview();
  toast('You left the meeting');
}

$('newMeeting').onclick=function(){startMeeting(randomCode())};
$('joinBtn').onclick=function(){startMeeting(cleanCode($('code').value))};
$('code').addEventListener('keydown',function(e){if(e.key==='Enter')$('joinBtn').click()});
$('name').addEventListener('keydown',function(e){if(e.key==='Enter')(cleanCode($('code').value)?$('joinBtn'):$('newMeeting')).click()});

/* ---- Start ---- */
(function(){
  var saved=store('atw-name');if(saved){$('name').value=saved;$('avatar').textContent=saved[0].toUpperCase()}
  var q=new URLSearchParams(location.search).get('room');
  if(q){$('code').value=cleanCode(q);$('joinBtn').textContent='Join meeting'}
  renderLobbyToggles();startPreview();
})();
</script>
<script src="https://meet.jit.si/external_api.js" async></script>
</body>
</html>
