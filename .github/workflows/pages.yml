name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Publish only the website: leave out the account server's code, old design files and repo settings.
      - name: Collect website files
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.gitignore' \
                   --exclude 'server' --exclude 'design' --exclude '_site' ./ _site/
          ls -R _site | head -50
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
